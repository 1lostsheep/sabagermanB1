<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>German Coach</title>
  <link rel="icon" href="/web/img/icon.svg">
  <link rel="stylesheet" href="/web/css/app.css">
</head>
<body>
  <header id="topbar">
    <button id="home-btn" class="icon-btn" aria-label="Home">🏠</button>
    <div class="counters">
      <span class="counter" id="streak" title="Days in a row">🔥 <b>0</b></span>
      <span class="counter" id="known" title="Words I know">⭐ <b>0</b></span>
    </div>
    <button id="paz-btn" class="icon-btn small" aria-label="Paz">⚙️</button>
  </header>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="/web/js/main.js"></script>
</body>
</html>
